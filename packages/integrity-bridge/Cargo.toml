[package]
name = "vw-integrity-bridge"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
build = "build.rs"

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
nix = { version = "0.30", features = ["signal", "process", "user", "fs"] }
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "io-util", "process", "signal", "sync"] }

[build-dependencies]
bindgen = "0.72"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
